name: 24/7 Automated Blog Publisher & Bol API Sync

on:
  schedule:
    - cron: '0 9 */3 * *' # Runs automatically every 3 days at 09:00 UTC
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab anytime!

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Discover New Relevant Bol.com Products (Max 1 Per Run)
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: node scripts/discover-products.js || true

      - name: Sync Live Bol.com Prices & Images via Bol API
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: node update-bol-prices.js || true

      - name: Generate New Kennisbank Article via DeepSeek AI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/generate-article.js

      - name: Verify Next.js Production Build
        run: npm run build

      - name: Commit and Push New Article & Product Updates to Main
        run: |
          git config --global user.name "DeAutokampeerder Bot"
          git config --global user.email "bot@deautokampeerder.nl"
          git add src/data/ src/content/kennisbank/
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(cron): discover new products, sync Bol prices & publish Kennisbank article via DeepSeek AI" && git push)
