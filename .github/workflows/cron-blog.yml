name: 24/7 Automated Blog Publisher (DeepSeek AI)

on:
  schedule:
    - cron: '0 9 */3 * *' # Runs automatically every 3 days at 09:00 UTC
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab anytime!

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate New Kennisbank Article via DeepSeek AI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/generate-article.js

      - name: Verify Next.js Production Build
        run: npm run build

      - name: Commit and Push New Article to Main
        run: |
          git config --global user.name "DeAutokampeerder Bot"
          git config --global user.email "bot@deautokampeerder.nl"
          git add src/content/kennisbank/
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(blog): publish new automated Kennisbank article via DeepSeek AI" && git push)
